<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | Salon Rich</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">

    <style>
        .page-header {
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=1600&q=80') center/cover;
            padding: 100px 20px 40px;
            text-align: center;
            border-bottom: 1px solid var(--accent-gold);
        }

        /* 🚀 Stepper */
        .stepper {
            display: flex; justify-content: center; align-items: center; max-width: 600px; margin: -20px auto 30px;
            background: var(--primary-dark); padding: 15px 30px; border-radius: 50px;
            border: 1px solid rgba(255, 215, 0, 0.3); box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            position: relative; z-index: 10;
        }
        .step { display: flex; align-items: center; gap: 8px; color: #777; font-size: 14px; font-weight: bold; }
        .step.active { color: var(--accent-gold); }
        .step.completed { color: #4CAF50; }
        .step-divider { flex-grow: 1; height: 2px; background: #333; margin: 0 15px; }
        .step-divider.completed { background: #4CAF50; }

        .booking-container {
            max-width: 900px; margin: 20px auto 50px; background: var(--secondary-dark);
            padding: 40px; border-radius: 20px; border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        .form-group { margin-bottom: 30px; text-align: left; }
        .form-group label { display: block; color: var(--accent-gold); margin-bottom: 10px; font-size: 16px; font-weight: bold;}
        
        .date-input {
            width: 100%; padding: 15px; background: #111; border: 1px solid #333;
            border-radius: 8px; color: white; font-size: 16px; cursor: pointer; text-align: center;
        }

        /* Slots Grid & Categories */
        .time-category { margin-bottom: 30px; }
        .time-category h3 { font-size: 16px; color: #aaa; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }

        .slot-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 12px 5px; border-radius: 10px; font-size: 15px; font-weight: 600; transition: 0.3s;
        }
        .slot-main-time { font-size: 16px; }
        .slot-end-time { font-size: 11px; font-weight: normal; margin-top: 5px; opacity: 0.7; }

        .slot-available { background: transparent; border: 2px solid #4CAF50; color: #4CAF50; cursor: pointer; }
        .slot-available:hover { background: rgba(76, 175, 80, 0.1); transform: translateY(-3px); }
        .slot-available.selected { background: #4CAF50; color: #fff; box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4); }
        .slot-unavailable { background: rgba(244, 67, 54, 0.05); border: 2px solid #f44336; color: #f44336; cursor: not-allowed; opacity: 0.5; }

        /* Confirm Section */
        .confirm-section {
            margin-top: 40px; padding-top: 30px; border-top: 1px dashed #444;
            text-align: center; display: none; 
            animation: slideUp 0.4s ease forwards;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .selected-summary-box {
            background: rgba(255, 215, 0, 0.05); border: 1px solid var(--accent-gold);
            padding: 20px; border-radius: 15px; margin-bottom: 25px;
        }
        .summary-text { color: #fff; font-size: 15px; margin-bottom: 5px; }
        .summary-time { color: var(--accent-gold); font-size: 22px; font-weight: bold; }

        .btn-confirm-booking {
            background: var(--accent-gold); color: #000; font-weight: bold; padding: 18px 50px;
            border: none; border-radius: 12px; font-size: 17px; cursor: pointer; transition: 0.3s;
            width: 100%; max-width: 400px;
        }
        .btn-confirm-booking:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255, 215, 0, 0.2); }

        /* Skeleton Loading */
        .skeleton-slot {
            height: 60px; border-radius: 10px; background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
            background-size: 200% 100%; animation: shimmer 1.5s infinite; border: 1px solid #333;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        .toast { position: fixed; bottom: 30px; right: 30px; background: #4CAF50; color: white; padding: 15px 25px; border-radius: 8px; transform: translateY(100px); opacity: 0; transition: 0.4s; z-index: 3000; }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container nav-container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <a href="../index.html" class="logo">
                <span class="logo-text" style="font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: white; letter-spacing: 2px;">SALON RICH</span>
            </a>
            <a href="services.html" style="color: var(--accent-gold); text-decoration: none; font-size: 14px; font-weight: bold;"><i class="fas fa-arrow-left"></i> Services</a>
        </div>
    </nav>

    <header class="page-header">
        <div class="container">
            <h1 style="color: var(--accent-gold); font-family: 'Playfair Display', serif;">Select Date & Time</h1>
            <p style="color: #ddd;">Service: <strong id="displayServiceName" style="color: white;">Premium Salon Service</strong></p>
        </div>
    </header>

    <div class="stepper">
        <div class="step completed"><i class="fas fa-check-circle"></i> Service</div>
        <div class="step-divider completed"></div>
        <div class="step active" id="stepTime"><i class="fas fa-clock"></i> Date & Time</div>
        <div class="step-divider" id="stepDivider2"></div>
        <div class="step" id="stepConfirm"><i class="fas fa-flag-checkered"></i> Confirm</div>
    </div>

    <section class="section container">
        <div class="booking-container">
            <div class="form-group">
                <label><i class="fas fa-calendar-alt"></i> 1. Pick a Date</label>
                <input type="text" id="bookingDate" class="date-input" placeholder="Tap to select your preferred date" required readonly>
            </div>

            <div class="form-group">
                <label><i class="fas fa-clock"></i> 2. Choose a Time Slot</label>
                
                <div class="status-legends">
                    <div class="legend-item"><div class="legend-box box-green"></div> Available</div>
                    <div class="legend-item"><div class="legend-box box-red"></div> Booked / Passed</div>
                </div>

                <div id="mainSlotsContainer">
                    <p style="color: #777; text-align: center; padding: 20px 0;"><i class="fas fa-calendar-day"></i> Please select a date first.</p>
                </div>
            </div>

            <div class="confirm-section" id="confirmSection">
                <div class="selected-summary-box">
                    <div class="summary-text">Your Selected Appointment:</div>
                    <div class="summary-time" id="summaryTimeText">--:-- AM</div>
                    <div style="color: #aaa; font-size: 13px; margin-top: 5px;" id="summaryDateText">YYYY-MM-DD</div>
                </div>
                <button type="button" id="btnConfirmBooking" class="btn-confirm-booking">Confirm My Appointment <i class="fas fa-arrow-right"></i></button>
            </div>
        </div>
    </section>

    <div id="toastMessage" class="toast">Booking Successful!</div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script type="module">
        import { auth, db } from '../js/firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let currentUser = null;
        let selectedTime = null;
        let selectedDateGlobal = null;
        
        // 🚨 Service Duration: විනාඩි 45 යි
        const DURATION_MINS = 45; 
        
        const urlParams = new URLSearchParams(window.location.search);
        let serviceName = urlParams.get('service') || "Premium Salon Service";
        document.getElementById('displayServiceName').innerText = serviceName;

        onAuthStateChanged(auth, (user) => {
            if (user) currentUser = user;
            else window.location.replace(`login.html?redirect=booking_time.html&service=${encodeURIComponent(serviceName)}`);
        });

        const mainSlotsContainer = document.getElementById('mainSlotsContainer');
        const confirmSection = document.getElementById('confirmSection');
        const summaryTimeText = document.getElementById('summaryTimeText');
        const summaryDateText = document.getElementById('summaryDateText');
        const btnConfirmBooking = document.getElementById('btnConfirmBooking');

        flatpickr("#bookingDate", {
            dateFormat: "Y-m-d",
            minDate: "today",
            onChange: function(selectedDates, dateStr) {
                selectedDateGlobal = dateStr;
                selectedTime = null;
                confirmSection.style.display = 'none';
                fetchBookingsAndGenerateSlots(dateStr); 
            }
        });

        function showSkeletons() {
            let html = `<div class="time-category"><h3><i class="fas fa-spinner fa-spin"></i> Checking Live Availability...</h3><div class="slots-grid">`;
            for(let i=0; i<8; i++) { html += `<div class="skeleton-slot"></div>`; }
            html += `</div></div>`;
            mainSlotsContainer.innerHTML = html;
        }

        // 🚀 Smart Helpers: Time (09:00 AM) විනාඩි වලට හරවන එක
        function timeToMins(timeStr) {
            const [time, period] = timeStr.split(' ');
            let [h, m] = time.split(':').map(Number);
            if (period === 'PM' && h !== 12) h += 12;
            if (period === 'AM' && h === 12) h = 0;
            return h * 60 + m;
        }

        // 🚀 Smart Helpers: විනාඩි ආපහු Time Text එකක් කරන එක
        function formatMinsToTime(totalMins) {
            let h = Math.floor(totalMins / 60);
            let m = totalMins % 60;
            let ampm = h >= 12 ? 'PM' : 'AM';
            let displayH = h > 12 ? h - 12 : (h === 0 ? 12 : h);
            return `${displayH.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')} ${ampm}`;
        }

        async function fetchBookingsAndGenerateSlots(selectedDateStr) {
            showSkeletons();
            try {
                const q = query(collection(db, "bookings"), where("date", "==", selectedDateStr));
                const querySnapshot = await getDocs(q);
                
                const bookedIntervals = [];
                querySnapshot.forEach((doc) => { 
                    const data = doc.data();
                    if (data.status !== "Cancelled") {
                        // DB එකේ තියෙන Book කරපු වෙලාව අරන්, ඒකේ ඉඳන් විනාඩි 45ක් යනකම් Interval එක හදනවා
                        const startMins = timeToMins(data.time);
                        bookedIntervals.push({ start: startMins, end: startMins + DURATION_MINS });
                    }
                });

                setTimeout(() => { generateCategorizedSlotsUI(selectedDateStr, bookedIntervals); }, 500);
            } catch (error) { mainSlotsContainer.innerHTML = '<p style="color: #f44336;">Error loading slots.</p>'; }
        }

        function generateCategorizedSlotsUI(dateStr, bookedIntervals) {
            mainSlotsContainer.innerHTML = '';
            const now = new Date();
            const isToday = (dateStr === flatpickr.formatDate(now, "Y-m-d"));

            let htmlMorning = `<div class="time-category"><h3><i class="fas fa-sun" style="color: #FFD700;"></i> Morning</h3><div class="slots-grid">`;
            let htmlAfternoon = `<div class="time-category"><h3><i class="fas fa-cloud-sun" style="color: #FF8C00;"></i> Afternoon</h3><div class="slots-grid">`;
            let htmlEvening = `<div class="time-category"><h3><i class="fas fa-moon" style="color: #8A2BE2;"></i> Evening</h3><div class="slots-grid">`;

            // 🚀 උදේ 08:30 සිට රාත්‍රී 09:00 (21:00) දක්වා ලූප් එක
            for (let h = 8; h <= 21; h++) {
                for (let m = 0; m < 60; m += 10) { 
                    if (h === 8 && m < 30) continue; // 08:30 AM ට කලින් එපා
                    if (h === 21 && m > 0) continue; // හරියටම 09:00 PM ට පස්සේ එපා (Last slot = 09:00 PM)
                    
                    let slotStartMins = h * 60 + m;
                    let slotEndMins = slotStartMins + DURATION_MINS;
                    
                    let timeString = formatMinsToTime(slotStartMins);
                    let endTimeString = `Ends ${formatMinsToTime(slotEndMins)}`;

                    // අද දවසේ පහු වුණ වෙලාවල් Expire කරනවා
                    let isExpired = false;
                    if (isToday) {
                        let nowMins = now.getHours() * 60 + now.getMinutes();
                        if (slotStartMins <= nowMins) isExpired = true;
                    }

                    // 🚨 Smart 45-Min Overlap Detection (මේකෙන් තමයි වටේ තියෙන ඒවා Auto Block කරන්නේ)
                    let isBooked = bookedIntervals.some(interval => {
                        // මේ Slot එක වෙන කෙනෙක්ගේ 45-min interval එක ඇතුළේ තියෙනවද කියලා බලනවා
                        return (slotStartMins < interval.end) && (interval.start < slotEndMins);
                    });

                    let btnClass = (isExpired || isBooked) ? 'slot-unavailable' : 'slot-available';
                    let clickAttr = (isExpired || isBooked) ? `disabled` : `onclick="window.selectSlot(this, '${timeString}')"`;

                    let btnHTML = `<button type="button" class="slot-btn ${btnClass}" ${clickAttr}><span class="slot-main-time">${timeString}</span><span class="slot-end-time">${endTimeString}</span></button>`;
                    
                    // කොටස් 3කට කඩනවා
                    if(h < 12) htmlMorning += btnHTML; 
                    else if(h < 16) htmlAfternoon += btnHTML; 
                    else htmlEvening += btnHTML;
                }
            }
            mainSlotsContainer.innerHTML = htmlMorning + "</div></div>" + htmlAfternoon + "</div></div>" + htmlEvening + "</div></div>";
        }

        window.selectSlot = function(clickedBtn, timeStr) {
            document.querySelectorAll('.slot-available').forEach(b => b.classList.remove('selected'));
            clickedBtn.classList.add('selected');
            selectedTime = timeStr;
            
            summaryTimeText.innerText = timeStr;
            summaryDateText.innerText = selectedDateGlobal;
            confirmSection.style.display = 'block';
            
            confirmSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        btnConfirmBooking.addEventListener('click', async () => {
            if (!currentUser || !selectedTime) return;
            btnConfirmBooking.disabled = true;
            btnConfirmBooking.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Securing Your Slot...';

            try {
                await addDoc(collection(db, "bookings"), {
                    userEmail: currentUser.email,
                    userName: currentUser.displayName || "Client",
                    service: serviceName,
                    date: selectedDateGlobal,
                    time: selectedTime,
                    status: "Pending", 
                    createdAt: new Date()
                });

                document.getElementById('toastMessage').classList.add('show');
                
                document.getElementById('stepTime').classList.remove('active');
                document.getElementById('stepTime').classList.add('completed');
                document.getElementById('stepDivider2').classList.add('completed');
                document.getElementById('stepConfirm').classList.add('active');
                document.getElementById('stepConfirm').classList.add('completed');

                setTimeout(() => { window.location.href = "my_bookings.html"; }, 2000);
            } catch (error) {
                alert("Failed to book. Please try again.");
                btnConfirmBooking.disabled = false;
                btnConfirmBooking.innerText = "Confirm My Appointment";
            }
        });
    </script>
</body>
</html>
